<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ログイン | ととのい黄金比</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="split">
    <section class="hero" aria-label="ととのい黄金比について">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-brand"><svg width="26" height="58" viewBox="0 0 30 68" aria-hidden="true"><rect x="10" y="2" width="10" height="46" rx="5" fill="none" stroke="#F2B35C" stroke-width="2"/><rect x="13" y="20" width="4" height="30" rx="2" fill="#E8743B"/><circle cx="15" cy="54" r="10" fill="#E8743B" stroke="#F2B35C" stroke-width="2"/></svg><span>ととのい黄金比</span></div>
      <div class="hero-copy">
        <h1>今日の体調で、<br>ととのう時間は<br>変わる。</h1>
        <p>サウナ・水風呂・外気浴の記録から、あなたに合う時間をいっしょに見つけます。</p>
      </div>
      <div class="hero-foot"><ul class="phase-legend"><li><i class="s"></i>サウナ:しっかり温まる</li><li><i class="w"></i>水風呂:ぎゅっと整える</li><li><i class="r"></i>外気浴:ゆっくり戻る</li></ul></div>
    </section>
    <section class="formside" aria-label="ログイン">
      <form id="login-form" class="auth-box" novalidate>
        <div class="auth-head">
          <h2>おかえりなさい</h2>
          <p>ログインして、続きから記録しましょう。</p>
        </div>
        <div class="field">
          <label for="login-email">メールアドレス</label>
          <input id="login-email" type="email" inputmode="email" autocomplete="email" maxlength="254" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="login-password">パスワード</label>
          <input id="login-password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
        </div>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn primary big">ログインする</button>
        <p class="auth-switch">はじめての方は <a href="register.html">アカウントをつくる</a></p>
        <p class="auth-note">あなたの記録は、あなたのアカウントにだけ保存されます。</p>
      </form>
    </section>
  </div>
  <script src="auth.js"></script>
</body>
</html>
